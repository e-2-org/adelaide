<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adelaide - Simon Faithfull</title>
<link rel="icon" type="image/png" href="icons/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
<link rel="shortcut icon" href="icons/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
<link rel="manifest" href="icons/site.webmanifest" />
<meta name="description" content="Adelaide consists of a flow of simple line drawings, the images hinting at an underlying narrative which never quite solidifies. The drawings dissolve in and out of their digital constituents and hang in the limbo of cyberspace like half remembered scenes in the folds of our memory.">
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #fff;
}
main {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}
/* the drawing is the button: each click shows the next one */
button {
    display: block;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
}
button:focus {
    outline: none;
}
button:focus-visible {
    outline: 1px dotted #999;
}
img {
    display: block;
    width: 594px;
    max-width: 100vw;
    height: auto;
}
</style>
</head>
<body>
<main>
    <button type="button" id="next" aria-label="Next drawing">
        <img src="images/adelaide/1_01.gif" width="594" height="600" alt="Adelaide">
    </button>
</main>
<script>
/*
 * The drawings, scene by scene: [scene, first, last] for images/adelaide/<scene>_<nn>.gif.
 * Scene 1 plays forward; scenes 2 to 9 each play forward and back again;
 * then scene 1 plays back, to start again from its first drawing.
 */
const SCENES = [[1, 1, 6], [2, 0, 6], [3, 1, 6], [4, 1, 4], [5, 1, 5], [6, 1, 6], [7, 1, 5], [8, 1, 6], [9, 1, 6]];

const src = (scene, n) => `images/adelaide/${scene}_${String(n).padStart(2, '0')}.gif`;
const range = (from, to) => Array.from({ length: Math.abs(to - from) + 1 }, (_, i) => from < to ? from + i : from - i);

const [[first, start, end], ...rest] = SCENES;
const sequence = [
    ...range(start, end).map(n => src(first, n)),
    ...rest.flatMap(([scene, a, b]) => [...range(a, b), ...range(b - 1, a)].map(n => src(scene, n))),
    ...range(end, start + 1).map(n => src(first, n)),
];

/* fetch every drawing in the background, so each click shows the next straight away */
new Set(sequence).forEach(url => new Image().src = url);

const img = document.querySelector('#next img');
let current = 0;
document.getElementById('next').addEventListener('click', () => {
    current = (current + 1) % sequence.length;
    img.src = sequence[current];
});
</script>
</body>
</html>
